      <g stroke="#dbeafe" stroke-opacity="0.55" stroke-width="2">
        <path d="M47 30H125"/><path d="M72 58H100"/><path d="M70 86H102"/><path d="M43 114H129"/>
        <path d="M31 142H141"/><path d="M37 170H135"/><path d="M61 198H111"/><path d="M75 226H97"/>
        <path d="M61 254H111"/><path d="M35 282H137"/><path d="M28 310H144"/>
      </g>
    </g>

    <g transform="translate(112 104)" fill="url(#elephant)">
      <ellipse cx="116" cy="98" rx="91" ry="67" opacity="0.96"/>
      <circle cx="54" cy="82" r="57" opacity="0.96"/>
      <ellipse cx="45" cy="85" rx="37" ry="48" fill="#0d1e37" opacity="0.72"/>
      <path d="M22 88 C-3 117 5 167 42 181 C59 188 70 170 57 160 C36 143 39 117 58 101 Z"/>
      <path d="M166 136 h23 v83 h-23zM104 145 h23 v74 h-23z"/>
      <path d="M188 73 C221 76 235 94 230 120 C226 139 239 145 251 132 C245 170 211 173 199 145 C190 124 191 96 188 73 Z"/>
