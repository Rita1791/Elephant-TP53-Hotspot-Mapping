  <g transform="translate(742 402)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="0.7">
    <text x="0" y="0" fill="#c4b5fd">COMPARATIVE GENOMICS</text>
    <circle cx="194" cy="-5" r="3" fill="#22d3ee"/>
    <text x="208" y="0" fill="#a5f3fc">ELEPROTECT v2.0</text>
  </g>
</svg>
