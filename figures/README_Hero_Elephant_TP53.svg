<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Elephant TP53 Hotspot Mapping</title>
  <desc id="desc">A research banner connecting human TP53 cancer hotspots with elephant comparative genomics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#11264a"/>
      <stop offset="1" stop-color="#173d4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="elephant" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1100" cy="72" r="180" fill="#7c3aed" opacity="0.08"/>
  <circle cx="1010" cy="360" r="210" fill="#22d3ee" opacity="0.07"/>

  <g transform="translate(62 62)">
    <rect x="0" y="0" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="21" cy="17" r="5" fill="#34d399"/>
    <text x="36" y="22" fill="#d9f9ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">PUBLISHED RESEARCH</text>

    <text x="0" y="98" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="49" font-weight="800">Elephant TP53</text>
    <text x="0" y="151" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="49" font-weight="800">Hotspot Mapping</text>
    <rect x="0" y="174" width="590" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="215" fill="#bed2ea" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Human cancer hotspots × elephant evolutionary genomics</text>

    <g transform="translate(0 251)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">
      <g><rect width="67" height="36" rx="18" fill="#7c3aed" fill-opacity="0.30" stroke="#a78bfa"/><text x="33.5" y="23" text-anchor="middle" fill="#f5f3ff">R175</text></g>
      <g transform="translate(79)"><rect width="67" height="36" rx="18" fill="#7c3aed" fill-opacity="0.30" stroke="#a78bfa"/><text x="33.5" y="23" text-anchor="middle" fill="#f5f3ff">G245</text></g>
      <g transform="translate(158)"><rect width="67" height="36" rx="18" fill="#0e7490" fill-opacity="0.34" stroke="#22d3ee"/><text x="33.5" y="23" text-anchor="middle" fill="#ecfeff">R248</text></g>
      <g transform="translate(237)"><rect width="67" height="36" rx="18" fill="#0e7490" fill-opacity="0.34" stroke="#22d3ee"/><text x="33.5" y="23" text-anchor="middle" fill="#ecfeff">R249</text></g>
      <g transform="translate(316)"><rect width="67" height="36" rx="18" fill="#047857" fill-opacity="0.34" stroke="#34d399"/><text x="33.5" y="23" text-anchor="middle" fill="#ecfdf5">R273</text></g>
      <g transform="translate(395)"><rect width="67" height="36" rx="18" fill="#047857" fill-opacity="0.34" stroke="#34d399"/><text x="33.5" y="23" text-anchor="middle" fill="#ecfdf5">R282</text></g>
    </g>
  </g>

